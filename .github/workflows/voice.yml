# Voice jobs: Claude pushes a script JSON to trigger/voice/<name>.json; this runs it with the engine secrets and puts the wav in Drive output/voice/<name>/.
# Free engines by default (Google Chirp 3 HD). Paid ones only when the script carries "allow_paid": true.
name: voice
on:
  push:
    branches: [main]
    paths: ['trigger/voice/**']
  workflow_dispatch:
    inputs:
      script:
        description: 'script path, e.g. trigger/voice/demo.json'
        required: true
permissions:
  contents: read
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ITCOD_RCLONE_REMOTE: 'gdrive,root_folder_id=1l9hOcWgtrDiYmqLMeLw9I8HjEW_BAJ1c:'
      RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      SCRIPT_IN: ${{ github.event.inputs.script }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Tools and packages
        run: |
          sudo apt-get -qq install -y ffmpeg rclone > /dev/null
          pip install -q --prefer-binary -r requirements.txt
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$RCLONE_TOKEN" > ~/.config/rclone/rclone.conf
      - name: Make the voice
        run: |
          if [ -n "$SCRIPT_IN" ]; then FILES="$SCRIPT_IN"; else FILES=$(git diff --name-only HEAD~1 HEAD -- 'trigger/voice/*.json'); fi
          for f in $FILES; do [ -f "$f" ] && ./run voice-run "$f" $([ "${{ contains(github.event.head_commit.message, '[voice-test]') }}" = "true" ] && echo --no-upload) | tail -3; done
