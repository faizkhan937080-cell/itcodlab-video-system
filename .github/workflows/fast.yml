# FAST render: the reel is cut into pieces, every piece renders on its own free machine at the same time, then they are glued (no re-encode).
name: fast
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'spec file'
        required: true
permissions:
  contents: write
concurrency:
  group: fast-${{ github.event.inputs.spec }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  ITCOD_RCLONE_REMOTE: 'gdrive,root_folder_id=1l9hOcWgtrDiYmqLMeLw9I8HjEW_BAJ1c:'
  RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
  PYTHONUNBUFFERED: '1'
  RCLONE_TIMEOUT: 2m
  RCLONE_TPSLIMIT: '6'
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System tools (background)
        run: nohup bash .github/scripts/apt_bg.sh > /tmp/apt_bg.log 2>&1 &
      - name: Python packages
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -q --prefer-binary -r requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: remotion/node_modules
          key: remotion-${{ hashFiles('remotion/package.json') }}
      - name: Remotion packages
        timeout-minutes: 10
        run: cd remotion && npm install --silent --no-audit --no-fund && npx remotion browser ensure
      - name: Wait for system tools
        run: |
          for i in $(seq 1 330); do [ -f /tmp/itcod/tools.done ] && break; sleep 2; done
          [ "$(cat /tmp/itcod/tools.done 2>/dev/null)" = "ok" ] || { echo "system tools missing"; exit 1; }
      - name: Connect Drive and GitHub
        run: |
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$RCLONE_TOKEN" > ~/.config/rclone/rclone.conf
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name itcod-worker; git config user.email worker@users.noreply.github.com
      - name: Render piece
        run: ITCOD_RENDER_CONCURRENCY=$(( $(nproc) / 2 + 1 )) ./run sample-shard "${{ github.event.inputs.spec }}" --part "${{ matrix.part }}" --parts 8 --out /tmp/parts
      - uses: actions/upload-artifact@v4
        with:
          name: piece-${{ matrix.part }}
          path: /tmp/parts
          retention-days: 1
  join:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System tools (background)
        run: nohup bash .github/scripts/apt_bg.sh > /tmp/apt_bg.log 2>&1 &
      - name: Python packages
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -q --prefer-binary -r requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Wait for system tools
        run: |
          for i in $(seq 1 330); do [ -f /tmp/itcod/tools.done ] && break; sleep 2; done
          [ "$(cat /tmp/itcod/tools.done 2>/dev/null)" = "ok" ] || { echo "system tools missing"; exit 1; }
      - name: Connect Drive and GitHub
        run: |
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$RCLONE_TOKEN" > ~/.config/rclone/rclone.conf
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name itcod-worker; git config user.email worker@users.noreply.github.com
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/pieces
          pattern: piece-*
          merge-multiple: true
      - name: Glue and finish
        run: ./run sample-join "${{ github.event.inputs.spec }}" --parts-dir /tmp/pieces | tail -30
