# Proves both Kaggle accounts log in. Runs when trigger/kaggle-check.txt changes.
name: kaggle-check
on:
  push:
    branches: [main]
    paths: ['trigger/kaggle-check.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE2_USERNAME: ${{ secrets.KAGGLE2_USERNAME }}
      KAGGLE2_KEY: ${{ secrets.KAGGLE2_KEY }}
      KAGGLE3_USERNAME: ${{ secrets.KAGGLE3_USERNAME }}
      KAGGLE3_KEY: ${{ secrets.KAGGLE3_KEY }}
      KGAT_NAME: ${{ secrets.KGAT_NAME }}
      KGAT_KEY: ${{ secrets.KGAT_KEY }}
      GGLE_USERNAME: ${{ secrets.GGLE_USERNAME }}
      GGLE_KEY: ${{ secrets.GGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q --prefer-binary -r requirements.txt
      - run: ./run kaggle-check
