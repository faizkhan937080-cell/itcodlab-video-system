# Footage jobs (wan -> free Kaggle GPU; ltx / minimax -> Modal free credit): Claude pushes a spec to trigger/videogen/<name>.json; this runs LTX on a free Kaggle GPU and puts the clip in Drive output/footage/<name>/.
# "probe": true only loads the model and reports (no video). MiniMax / Veo are gated in scripts/videogen.py (Faiz's Y / allow_paid).
name: videogen
on:
  push:
    branches: [main]
    paths: ['trigger/videogen/**']
  workflow_dispatch:
    inputs:
      spec:
        description: 'spec path, e.g. trigger/videogen/demo.json'
        required: true
permissions:
  contents: write   # reel test: collage goes to branch review (newest only)
concurrency:
  group: videogen-${{ github.event.inputs.spec || github.sha }}
  cancel-in-progress: false
jobs:
  videogen:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ITCOD_RCLONE_REMOTE: 'gdrive,root_folder_id=1l9hOcWgtrDiYmqLMeLw9I8HjEW_BAJ1c:'
      RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE2_USERNAME: ${{ secrets.KAGGLE2_USERNAME }}
      KAGGLE2_KEY: ${{ secrets.KAGGLE2_KEY }}
      KAGGLE3_USERNAME: ${{ secrets.KAGGLE3_USERNAME }}
      KAGGLE3_KEY: ${{ secrets.KAGGLE3_KEY }}
      KAGGLE_THECRUSHKING_NAME: ${{ secrets.KAGGLE_THECRUSHKING_NAME }}
      KAGGLE_THECRUSHKING_KEY: ${{ secrets.KAGGLE_THECRUSHKING_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SPEC_IN: ${{ github.event.inputs.spec }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Tools and packages
        run: |
          sudo apt-get -qq install -y rclone ffmpeg > /dev/null
          pip install -q --prefer-binary -r requirements.txt modal && pip install -q -U yt-dlp
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$RCLONE_TOKEN" > ~/.config/rclone/rclone.conf
      - name: Give git push rights for the review branch
        run: git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
      - name: Restore finished face-swap pieces (resume, never start from 0)
        uses: actions/cache/restore@v6
        with:
          path: work/faceswap-cache
          key: faceswap-cache-${{ github.run_id }}
          restore-keys: faceswap-cache-
      - name: Make the footage
        run: |
          mkdir -p work/faceswap-cache
          if [ -n "$SPEC_IN" ]; then FILES="$SPEC_IN"; else FILES=$(git diff --name-only HEAD~1 HEAD -- 'trigger/videogen/*.json'); fi
          for f in $FILES; do [ -f "$f" ] && ./run videogen-run "$f" | tail -40; done
      - name: Keep finished face-swap pieces for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: work/faceswap-cache
          key: faceswap-cache-${{ github.run_id }}
